name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked CDK CLI
        run: npm ci

      - name: Verify successful CI run and immutable artifact
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ci_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          jq -e --arg sha "${SOURCE_SHA}" --arg repo "${GITHUB_REPOSITORY}" \
            '.name == "CI" and .event == "push" and .head_branch == "main" and
             .head_sha == $sha and .head_repository.full_name == $repo and
             .conclusion == "success"' <<<"$ci_json" >/dev/null
          artifact="telemetry-${SOURCE_SHA}"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100")"
          digest="$(jq -r --arg name "$artifact" \
            '[.artifacts[] | select(.name == $name and .expired == false)] |
             if length == 1 then .[0].digest else empty end' <<<"$artifacts_json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" --dir release
          cd release
          sha256sum --check artifact-manifest.sha256
          sha256sum --check artifact-files.sha256
          test "$(cat source-commit.txt)" = "$SOURCE_SHA"
          test -f cdk.staging.out/Telemetry-staging.template.json
          test -f cdk.production.out/Telemetry-production.template.json
          test -f cdk.audit.out/TelemetryAudit.template.json
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Validate staging identity configuration
        shell: bash
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TOPIC_ARN: ${{ vars.OPERATIONS_ALARM_TOPIC_ARN }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ROLE_ARN" == "arn:aws:iam::${ACCOUNT_ID}:role/"* ]]
          [[ "$TOPIC_ARN" == "arn:aws:sns:${AWS_REGION}:${ACCOUNT_ID}:"* ]]

      - name: Require audit resources to be separately provisioned
        run: >-
          jq -e '[.Resources[] | select(.Type == "AWS::CloudTrail::Trail")] | length == 0'
          release/cdk.staging.out/Telemetry-staging.template.json

      - name: Assume staging deployment role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: staging-${{ github.run_id }}

      - name: Require active account audit trail
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws cloudtrail get-trail-status --name telemetry-audit --query IsLogging --output text)" = True

      - name: Deploy validated staging assembly
        env:
          OPERATIONS_ALARM_TOPIC_ARN: ${{ vars.OPERATIONS_ALARM_TOPIC_ARN }}
        run: |
          npx cdk deploy --app release/cdk.staging.out Telemetry-staging \
            --parameters "OperationsAlarmTopicArn=${OPERATIONS_ALARM_TOPIC_ARN}" \
            --require-approval never --ci --outputs-file staging-outputs.json

      - name: Verify stack and Lambda readiness
        shell: bash
        run: |
          set -euo pipefail
          function_arn="$(jq -er '."Telemetry-staging".TelemetryFunctionArn' staging-outputs.json)"
          aws lambda wait function-updated --function-name "$function_arn"
          function_state="$(aws lambda get-function-configuration --function-name "$function_arn" --query State --output text)"
          test "$function_state" = Active
          stack_json="$(aws cloudformation describe-stacks --stack-name Telemetry-staging --output json)"
          status="$(jq -r '.Stacks[0].StackStatus' <<<"$stack_json")"
          [[ "$status" == CREATE_COMPLETE || "$status" == UPDATE_COMPLETE ]]
          stack_id="$(jq -r '.Stacks[0].StackId' <<<"$stack_json")"
          template_sha="$(sha256sum release/cdk.staging.out/Telemetry-staging.template.json | cut -d ' ' -f 1)"
          jq -n --arg sha "$SOURCE_SHA" --arg ci_run "$CI_RUN_ID" \
            --arg digest '${{ steps.source.outputs.digest }}' \
            --arg stack "$stack_id" --arg status "$status" \
            --arg template "$template_sha" --arg account '${{ vars.AWS_ACCOUNT_ID }}' \
            --arg region '${{ vars.AWS_REGION }}' \
            '{source_commit:$sha,ci_run_id:$ci_run,ci_artifact_digest:$digest,
              stack_id:$stack,stack_status:$status,staging_template_sha256:$template,
              account_id:$account,region:$region}' > staging-evidence.json
          cat staging-evidence.json >> "$GITHUB_STEP_SUMMARY"

      - name: Store staging evidence
        uses: actions/upload-artifact@v6
        with:
          name: staging-evidence-${{ env.SOURCE_SHA }}
          path: staging-evidence.json
          if-no-files-found: error
          retention-days: 30
